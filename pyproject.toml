[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "methylation-diffusion"
version = "0.1.0"
description = "Exploratory fold-local diffusion augmentation of cervical methylation"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyarrow", "torch", "PyYAML", "matplotlib", "lxml"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
